<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen Dictation</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="pill-container" class="pill state-listening">
    <!-- Icon area -->
    <div class="icon-wrapper">
      <!-- Mic Icon -->
      <svg id="icon-mic" class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>

      <!-- Processing Spinner -->
      <div id="spinner" class="spinner state-icon"></div>

      <!-- Error Icon -->
      <svg id="icon-error" class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>

      <!-- Success / Done Icon -->
      <svg id="icon-done" class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>

    <!-- Live Audio Waveform Bars -->
    <div id="waveform" class="waveform">
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
      <span class="bar bar-4"></span>
      <span class="bar bar-5"></span>
    </div>

    <!-- Status Text -->
    <div id="status-text" class="status-text">Listening...</div>

    <!-- Subtle glow element -->
    <div class="glow-bg"></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
