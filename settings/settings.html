<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen - Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <header class="settings-header">
      <div class="header-brand">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
        <div>
          <h1>Listen Dictation</h1>
          <p class="subtitle">Global voice-to-text with auto-paste</p>
        </div>
      </div>
    </header>

    <!-- Main Form -->
    <main class="settings-body">
      <!-- Section 1: Speech-to-Text Provider -->
      <div class="form-section">
        <label class="section-title">Speech-to-Text Provider</label>
        
        <div class="provider-cards">
          <label class="provider-card" id="card-groq">
            <input type="radio" name="provider" value="groq" id="provider-groq">
            <div class="card-content">
              <span class="provider-name">Groq Cloud</span>
              <span class="provider-badge">Ultra-Fast (~300ms)</span>
            </div>
          </label>

          <label class="provider-card" id="card-openai">
            <input type="radio" name="provider" value="openai" id="provider-openai">
            <div class="card-content">
              <span class="provider-name">OpenAI</span>
              <span class="provider-badge">Whisper API</span>
            </div>
          </label>
        </div>

        <!-- Model Selection -->
        <div class="input-group">
          <label for="model-select">Transcription Model</label>
          <select id="model-select" class="select-input">
            <!-- Populated dynamically based on provider -->
          </select>
        </div>

        <!-- API Key Input -->
        <div class="input-group">
          <div class="label-with-action">
            <label for="api-key-input">API Key</label>
            <button type="button" id="btn-test-key" class="text-button">Test Connection</button>
          </div>
          <div class="password-wrapper">
            <input type="password" id="api-key-input" placeholder="Paste your API key here (gsk_... or sk-...)">
            <button type="button" id="toggle-key-visibility" class="icon-toggle" title="Show/Hide Key">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div id="test-key-status" class="status-indicator"></div>
          <p class="field-hint" id="api-hint">
            Get your Groq API key at <a href="#" id="link-provider-console">console.groq.com/keys</a>
          </p>
        </div>
      </div>

      <!-- Section 2: Global Shortcut -->
      <div class="form-section">
        <label class="section-title">Global Dictation Shortcut</label>
        <p class="section-desc">Press this combination from any application to start/stop dictation.</p>
        
        <div class="shortcut-recorder" id="shortcut-recorder-box" tabindex="0">
          <div class="shortcut-keys" id="shortcut-badges">
            <!-- Badges rendered by JS -->
          </div>
          <span class="recorder-hint" id="recorder-hint">Click to change shortcut</span>
        </div>

        <div class="shortcut-actions">
          <button type="button" id="btn-reset-shortcut" class="text-button">Reset to Default (Ctrl+Shift+Space)</button>
        </div>
      </div>

      <!-- Section 3: Advanced Options -->
      <div class="form-section">
        <label class="section-title">Paste & Injection Timing</label>
        <div class="input-group inline">
          <label for="paste-delay-input">Paste delay after transcription (ms)</label>
          <input type="number" id="paste-delay-input" min="20" max="1000" step="10" value="80" class="number-input">
        </div>
      </div>
    </main>

    <!-- Footer with Save button -->
    <footer class="settings-footer">
      <div id="save-status" class="save-status"></div>
      <div class="action-buttons">
        <button type="button" id="btn-cancel" class="btn btn-secondary">Close</button>
        <button type="button" id="btn-save" class="btn btn-primary">Save Changes</button>
      </div>
    </footer>
  </div>

  <script src="settings.js"></script>
</body>
</html>
